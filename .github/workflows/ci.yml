name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Python helpers
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build documentation
        run: |
          cargo install mdbook --version 0.5.3 --locked
          mdbook build docs/mdbook

  windows:
    name: Windows x86_64
    # Fork PRs run source checks; private dependency access stays in trusted builds.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    needs: checks
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      REZ_DISABLE_HOME_CONFIG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Fetch locked dependencies
        env:
          DEPENDENCIES_TOKEN: ${{ secrets.DEPENDENCIES_TOKEN }}
          DEPENDENCY_NODES_SSH_KEY: ${{ secrets.DEPENDENCY_NODES_SSH_KEY }}
          DEPENDENCY_BOX_SSH_KEY: ${{ secrets.DEPENDENCY_BOX_SSH_KEY }}
          DEPENDENCY_WIDGETS_SSH_KEY: ${{ secrets.DEPENDENCY_WIDGETS_SSH_KEY }}
          DEPENDENCY_LAYOUT_SSH_KEY: ${{ secrets.DEPENDENCY_LAYOUT_SSH_KEY }}
        run: python ci/fetch_dependencies.py
      - name: Cache compiled dependencies
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5.0.0
        with:
          path: target
          key: windows-x86_64-stable-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Test release workspace
        run: cargo test --locked --offline --workspace --release -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --offline --workspace --release --all-targets -- -D warnings
      - name: Build and stage release
        run: python bootstrap.py p --force
      - name: Verify staged binary and sources
        id: package
        shell: pwsh
        run: |
          python ci/verify_dist.py --require-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem dist/rez_rs -Directory)
          if ($packages.Count -ne 1) { throw 'Expected exactly one staged version' }
          "directory=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Verify CPython 3.13 distribution
        id: python
        shell: pwsh
        run: |
          python ci/verify_python_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem dist/python -Directory)
          if ($packages.Count -ne 1) { throw 'Expected exactly one staged Python version' }
          "directory=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Verify the same abi3 distribution on CPython 3.10
        run: python ci/verify_python_api.py
      - name: Upload verified Python package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-python
          path: |
            ${{ steps.python.outputs.directory }}/rez-rs-python.zip
            ${{ steps.python.outputs.directory }}/rez-rs-python.zip.sha256
            ${{ steps.python.outputs.directory }}/python-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload verified executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x86_64
          path: |
            ${{ steps.package.outputs.directory }}/rez.exe
            ${{ steps.package.outputs.directory }}/rez.exe.sha256
            ${{ steps.package.outputs.directory }}/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged executable
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: windows
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-x86_64
          path: release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-python
          path: release
      - name: Verify release assets and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check rez.exe.sha256
          sha256sum --check rez-rs-python.zip.sha256
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('verification.json').read_text())
          if os.environ['TAG'].removeprefix('v') != receipt['version']:
              raise SystemExit('Tag must match the Cargo package version')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" release/rez.exe release/rez.exe.sha256 release/verification.json release/rez-rs-python.zip release/rez-rs-python.zip.sha256 release/python-verification.json --clobber
          gh release edit "$TAG" --draft=false --prerelease="$prerelease"
