name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
  REZ_DISABLE_HOME_CONFIG: '1'

jobs:
  build:
    name: ${{ matrix.platform }}
    # Private Git dependencies need DEPENDENCIES_TOKEN, which fork PRs do not receive.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The abi3 extension is built with 3.13 (the last, default interpreter)
      # and its extracted archive is also tested on the 3.10 minimum.
      - uses: actions/setup-python@v7.0.0
        id: py310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Set up stable Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - uses: taiki-e/install-action@v2.87.26
        with:
          tool: mdbook@0.5.3
      - name: Authorize private Git dependencies
        shell: bash
        env:
          TOKEN: ${{ secrets.DEPENDENCIES_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo 'DEPENDENCIES_TOKEN secret is not set'; exit 1; }
          git config --global url."https://x-access-token:${TOKEN}@github.com/ssoj13/".insteadOf "ssh://git@github.com/ssoj13/"
          echo CARGO_NET_GIT_FETCH_WITH_CLI=true >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Check, test, build, package and verify
        run: python bootstrap.py ci --target ${{ matrix.target }} --python "${{ steps.py310.outputs.python-path }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release ZIPs
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64 macos-aarch64; do
            test -f "release/rez-rs-${TAG}-${platform}.zip"
            test -f "release/rez-rs-python-${TAG}-${platform}.zip"
          done
          shopt -s nullglob
          archives=(release/*.zip)
          test "${#archives[@]}" -eq 6
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --generate-notes \
              --title "$TAG" "${prerelease[@]}"
          fi
          gh release upload "$TAG" "${archives[@]}" --clobber
          gh release edit "$TAG" --draft=false "${prerelease[@]}"
