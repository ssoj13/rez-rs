[package]
name = "repository"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
foundation = { path = "../foundation" }
version = { path = "../version" }
model = { path = "../model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "1.1", features = ["preserve_order"] }
regex = "1.13"
lru = "0.18"
memcache = { version = "0.21", default-features = false }
rayon = "1.12"
sha1 = "0.11"
sha2 = "0.11"
filetime = "0.2"
tempfile = "3"
pathdiff = "0.2"
dirs = "7"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
python-runtime = { path = "../python-runtime" }
