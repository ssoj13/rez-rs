[package]
name = "rez-python-api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CPython bindings and Rez-compatible Python facade for rez-rs"
repository = "https://github.com/ssoj13/rez-rs"

[lib]
name = "rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["abi3-py310"] }
foundation = { path = "../foundation" }
version = { path = "../version" }
model = { path = "../model" }
repository = { path = "../repository" }
resolve = { path = "../resolve" }
serde_json = "1.0"

[build-dependencies]
pyo3-build-config = "=0.29.3"
