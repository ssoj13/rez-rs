[package]
name = "resolve"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
foundation = { path = "../foundation" }
version = { path = "../version" }
model = { path = "../model" }
python-runtime = { path = "../python-runtime" }
repository = { path = "../repository" }
rex = { path = "../rex" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1.13"
tempfile = "3"
sha1 = "0.11"
sha2 = "0.11"
chrono = "0.4"
dirs = "7"
hostname = "0.4"
pathdiff = "0.2"
lapin = { version = "4", optional = true }
async-global-executor = { version = "3", optional = true }
urlencoding = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
bin-patch-elf = { path = "../../bin-patch/crates/bin-patch-elf" }

[target.'cfg(target_os = "macos")'.dependencies]
bin-patch-macho = { path = "../../bin-patch/crates/bin-patch-macho" }

[features]
default = []
amqp = ["dep:lapin", "dep:async-global-executor", "dep:urlencoding"]
