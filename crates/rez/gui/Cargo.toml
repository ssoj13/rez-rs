[package]
name = "gui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
foundation = { path = "../foundation" }
version = { path = "../version" }
model = { path = "../model" }
repository = { path = "../repository" }
resolve = { path = "../resolve" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "web_screen_reader", "x11", "persistence"] }
nodes-core = { git = "ssh://git@github.com/ssoj13/nodes-rs.git", branch = "main", package = "nodes-core" }
nodes-editor = { git = "ssh://git@github.com/ssoj13/nodes-rs.git", branch = "main", package = "nodes-editor", default-features = false }
rfd = "0.17"
dirs = "7"

[dev-dependencies]
tempfile = "3"
