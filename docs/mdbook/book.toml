[book]
title = "rez-rs: Experimental Rust Port of Rez"
authors = ["rez-rs contributors"]
language = "en"
src = "src"

[build]
build-dir = "../build"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/ssoj13/rez-rs"
edit-url-template = "https://github.com/ssoj13/rez-rs/edit/main/docs/mdbook/{path}"

[output.html.fold]
enable = true
level = 1

